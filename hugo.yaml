#            url: "https://madxxi.github.io/incident-runbook-templates/"

      - title: "US Retiree Selector:  State and Healthcare Analyzer"
        category: "personal"
        content: "This is another personal project that some will find useful to replicate.
                 It is a simple tool that allows you to evaluate, based on current laws and taxation rules,
                 which states may provide you the best advantages in the US where you can maximize not only 
                 taxes based on local laws, but also where healthcare options and local property taxes may present 
                 you advantages.  It is a personal project that I developed to easily evaluate my own options, and 
                 I am sharing it here as a blueprint for others to address and perhaps even expand their personal 
                 needs.  You can add all sources of income, the tool will give you a weighed in set of options 
                 for you to qualify them.
                 P.S.  It can use your claude API Key, but you can also configure others (Gemini AI Studio is free)!
                 download the two files: index.html and README.txt, and then configure the index.html file with your own API key!"
        image: "/images/projects/happy-retirement.jpg"
        featured:
