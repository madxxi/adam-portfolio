          with Mynor's organization. Mynor is a very strict, open-minded, professional and dedicated
          person. He is clearly really involved in his work, always ready to ensure we progress in the
          right direction. One key positive point according to me is that Mynor has ensured his teams
          do not only understand the technical side of our programs, but also the functional and
          strategic aspects of our business. This curiosity, and wish to master a part of the business
          which was not mandatory for doing their standard activities, was certainly the key point for
          ensuring such a successful organization, by ensuring people are involved in the evolution of
          our business, and are not only "pressing buttons" without really understanding what is
          happening behind. This resulted in higher quality of work and increased motivation of all
          people working in our respective teams. Last, I had the pleasure to have Mynor joining my
          department during a few weeks in Nice (the idea was for him to better understand the way we
          work and see what could perhaps be enhanced in our current processes). On top of working with
          a very professional person, my teams were pleased to have the opportunity to meet Mynor
          during those few weeks, and to have with him a different relationship than the standard
          "business" one. Everyone appreciated his positive spirit, good relationship, and his
