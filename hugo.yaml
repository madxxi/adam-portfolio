  # ---- ABOUT ----
  about:
    enable: true
    title: "About Me"
    image: "/images/Adam-CzechRepublic.jpg"
    content: |-
      I'm a Lead Systems Engineer with 20+ years of experience across site reliability
      engineering, platform operations, and observability tooling, most recently at
      **Amadeus**, working within high-availability global airline reservation infrastructure.

      I have also delved, as part of that experience, into the ITIL model realm dealing with
      incident, change, and problem management, and led teams in a 24/7 environment to maintain 
      99.x% availability for production mission-critical systems.

      My focus is on making systems observable and incidents boring: alerting-as-code with
      Prometheus and PromQL, Grafana dashboards, and helping design and build systems that are 
      centered on prevention and self-recovery and actually reach the people who actually get
      things corrected, with git-based workflows for infrastructure changes, and clean incident 
      routing through ServiceNow or another incident management system. I hold a MS in Computer 
      Information Systems from Nova Southeastern University and a MBA from the University of Florida, 
      and I'm a U.S. military veteran.

      I'm currently open to Lead/Senior SRE, Platform Engineering, and Cloud Infrastructure roles. 
      I am also available for Incident/Change/Problem Management as well as SRE Management roles, 
      primarily remote, but open to hybrid (40/60) based in South Florida in Broward County or Northern Miami Dade.

      Also, it's not only what I bring along with my experience and skills! Throughout my carrer I built a very
      strong network of professionals with expertise as SREs, platform engineers, cloud architects, 
      Senior DBAs, developers, network administrations, and a wide array of experts who I can reach out to 
      for advice, guidance, and collaboration!  A goldmine of knowledge and experience that I can tap 
      into to solve problems, improve processes, and drive innovation.

    skills:
      enable: true
      title: "My Technologies Toolkit"
      subtitle: "Some of my reliability & leadership in practice toolkit. A few tags link straight to a project 
                 or reference that shows the skill in use."
