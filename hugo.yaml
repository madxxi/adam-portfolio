  # ---- EXPERIENCE ----
  # Add earlier roles below the Amadeus entry as additional "company" blocks.
  experience:
    enable: true
    items:
      - company: "Amadeus"
        companyUrl: "https://www.amadeus.com"
        jobs:
          - name: "Senior Service Reliability Engineer (SRE) - Cloud Technologies"
            date: "Jan 2019 - Mar 2026 / Mar 2020- May 2023 (Remote)"
            info:
              content: "Site reliability & platform operations for global airline reservation infrastructure"
            content: |
              Leading reliability engineering and platform operations for high-availability,
              global-scale airline reservation systems.

              - Maintained a 196–200/200 Service Stability Index (SSI), Amadeus's internal reliability scorecard tied to 
              MTTR, for 12 consecutive years (2013–2025), resolving 95%+ of incidents within target: sub-20-minute MTTR 
              on critical outages and sub-30-minute on degradations.
              - Implemented SLI/SLO frameworks and multi-window error-budget burn-rate alerting across 460+ mission-critical 
              travel applications, cutting false-positive pages by 50% and focusing engineering effort on the highest-risk 
              reliability work.
              - Built a library that resulted in 100+ templated Prometheus/Thanos (PromQL) alert rules with Go-based tooling 
              that auto-generated Grafana dashboards and routed incidents to ServiceNow; automated rule rollout with GitHub 
              Actions and Bash, reducing on-call pages by ~250/week, deployment time from 120 to 15 minutes, and manual 
              toil by ~10 hours/week.
              - Led multi-phase migration of 400+ applications and 2,600 Linux hosts from physical to virtual infrastructure, 
              then to private Red Hat OpenShift (v3/v4) and public Microsoft Azure, decomposing the portfolio into 460+ 
              microservices-based applications with zero customer-facing downtime and eventually reduced provisioning time 
              from 6 weeks to 48 hours. 
              - Reduced average troubleshooting time on complex incidents by 15% by introducing AIOps practices, including 
              AI-assisted diagnosis (GitHub Copilot, Claude, GPT-4) and RAG-based retrieval over Confluence runbooks and 
              operational procedures; cut runbook creation for new ServiceNow alert types from 2 hours to 15 minutes.
              - Trained and onboarded 25+ engineers as official instructor for the Amadeus Cloud Services (ACS) curriculum 
              (ACS Induction; ACS Incidents and Recovery), shortening new-hire time to operational readiness from 12 to 2 weeks.

          - name: "Sr. Systems Engineer (Unix/Linux) / Lead Systems Engineer"
            date: "Apr 2005 - Jun 2008 / Jul 2008 - Dec 2018"
            info:
              content: "Senior and then Lead Systems Engineer of teams responsible for all production Linux/Unix systems supporting airline reservation infrastructure"
            content: |
              - Served as technical lead for a global 24/7 team of 9 engineers without formal reporting authority, providing 
              performance assessments that fed formal review cycles, and significantly influencing hiring decisions; mentored 
              18 engineers into senior roles over 10 years and cut team turnover by 25%.
              - Served as Incident Commander (2013–2018) for ~15 major production incidents per year, directing cross-team 
              response and stakeholder communications through resolution; led ITIL incident, problem, and change management 
              with root-cause and preventive actions across thousands of production systems, reducing repeat incidents by 
              95% and change-related outages by 90%.
              - Owned operational stability and risk management for a €2.7B revenue-supporting environment of 5,500+ production 
              and test systems (HP-UX, Linux), overseeing high-availability clusters (Veritas, MC/ServiceGuard) and leading 250 
              major OS and database upgrades while sustaining 99.99% uptime on clustered production services.
              - Developed Perl and PHP monitoring and recovery tools that eliminated ~20 hours/week of manual checks; the 
              tooling was showcased at sites in France and England and led to the formation of a dedicated alerting and monitoring
               team in 2014.
              - Supported 10 Oracle version migrations and IBM MQ incident resolution across Dev, Pre-Prod, and Prod environments, 
              completing all within planned maintenance windows with zero data loss.

