                 which states may provide you the best advantages in the US where you can maximize not only 
                 taxes based on local laws, but also where healthcare options and local property taxes may present 
                 you advantages.  It is a personal project that I developed to easily evaluate my own options, and 
                 I am sharing it here as a blueprint for others to address and perhaps even expand their personal 
                 needs.  You can add all sources of income, the tool will give you a weighted in set of options 
                 for you to qualify them.
                 P.S.  It can use your claude API Key, but you can also configure others (Gemini AI Studio is free)!
                 Download the two files: index.html and README.txt, and then configure the index.html file with your own API key!"
        image: "/images/projects/digital-nomad.png"
        featured:
          name: "View Repo"
          link: "https://madxxi.github.io/retirement-analyzer/"
        badges:
          - "US Location options"
          - "Best Options to save income"
          - "Know your options in the US"
        links:
          - icon: fab fa-github
            url: "https://github.com/madxxi/retirement-analyzer/"

      - title: "US Expat Selector:  Living Abroad!"
        category: "personal"
        content: "This is another personal project that some will find useful to replicate.
                 It is another version of the US Analyzer, but this one is focused on evaluating options 
                 for US citizens who are considering living abroad.  The key factors considered are cost of living, 
                 healthcare quality, taxation burden, visa ease, and property rights.  
                 This is a personal project that I developed to easily evaluate my own options, and I am
                 sharing it here as a blueprint for others to address and perhaps even expand their personal needs.  
                 You can add all sources of income, the tool will give you a weighed in set of options for you to 
                 qualify them.
                 P.S.  It can use a variety of AI API Keys. Download locally the index.html and configure 
                 your own API key in the index.html file!"
