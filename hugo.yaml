      - title: "Personal Privacy Checker"
        category: "personal"
        content: "What I consider another interesting personal project, it checks how exposed is your privacy! 
                 In the US we have a big problem (which is not a rampant issue in Europe thanks to GDPR), that our personal 
                 information is sold everywhere!  Most of us are unaware, and this information ends up exposed in an number of 
                 unimaginable places!  Since the government has not provided us any built-in protections, we are only left with 
                 the option to protect ourselves.  The law (federal and state) may be able to assist, but only in a reactive way, 
                 and only after we discover how exposed our private information is, we must take initial steps to address it.  
                 This is a dear and personal project, since my personal information was compromised a while ago, seeking to protect
                 that privacy as best as I can.  This is but a template, you must configure it with your personal information!"
        image: "/images/projects/identity-theft.jpeg"
        featured:
          name: "View Repo"
          link: "https://github.com/madxxi/privacy-guardian-template"
        badges:
