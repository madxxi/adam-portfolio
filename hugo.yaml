      - name: "Jean-Noël Donadio"
        role: "Amadeus, Nice (France)"
        content: >-
          I have had the chance to work with Mynor for a few years now. While my teams are based in
          Nice (France), Mynor's team is based in Miami and is basically taking care of the follow-up
          of the application my teams are in charge of (Mynor's organization is taking care of
