  # ---- RECOMMENDATIONS ----
  # Pulled from LinkedIn's Recommendations Received export (PDF), lightly
  # cleaned up for obvious typos only — wording and substance are theirs,
  # not rewritten. Anonymous "LinkedIn User" entries stay unnamed since
  # LinkedIn itself doesn't expose who they are. `role` is inferred from
  # context in the quote itself where LinkedIn didn't give a title.
  recommendations:
    enable: true
    title: "Recommendations"
    subtitle: "Observations from my colleagues"
    # How many cards show before "Show all" is clicked. Keep it in the
    # 6-9 range so the section reads as a preview, not a wall — tune it
    # here any time without touching the template or CSS.
    visibleCount: 6
    items:
      - name: "Polo-François Poli"
        role: "Colleague, Amadeus (2008–2012)"
        content: >-
          I worked with Mynor from 2008 to 2012 during his time leading US operations for Amadeus.
          In an environment that serves as the heart of the global reservation system — powering the
          majority of the world's airlines and airports — Mynor was responsible for incident
          management, service reliability, and deployment. What truly set Mynor apart was the
          operational excellence he instilled in his team and his customer-obsessed approach to
          service stability. When disruptions occurred that could impact travel infrastructure
          globally, Mynor remained calm and professional, leading his team to act with total
          precision. He didn't work in a vacuum; he was a bridge-builder who worked hand-in-hand with
          product development teams to drive swift, effective resolutions. His leadership style was
          defined by a rare combination of technical rigor and a collaborative spirit. Mynor is an
          extremely driven professional, and his ability to lead through mission-critical challenges
          made him an invaluable partner to work with.

      - name: "LinkedIn Colleague"
        role: "Colleague, Amadeus"
        content: >-
          I worked with Mynor Diaz during his time as Lead Systems Engineer at Amadeus. He
          consistently demonstrated strong technical knowledge, particularly in system stability and
          high-availability environments. Mynor was proactive in addressing issues and led teams to
          fast incident recoveries. He was also a supportive and approachable colleague, making
          collaboration easy across teams — even across the globe.

      - name: "Sébastien Evrard"
        role: "Product Owner, Monitoring Solutions – Amadeus"
        content: >-
          I have cooperated with Mynor in the context of the Monitoring Solutions (I was at that time
          the Product Owner of this) used by the entire Front Line Service teams. He contributed
          significantly to the shaping of critical parts of the solution by providing clear
          requirements and sharing a pragmatic vision of the day-to-day of our solution users. He
          demonstrated an ability to go into the technical details of our platform and worked hand in
          hand with our team to define an achievable and still efficient solution. Mynor is this kind
          of team worker that you appreciate for his involvement, dedication and perseverance. He will
          spend all the required efforts (and more) to get things understood, and if required he is
          even able to stretch his role, as for instance when he managed required SAFe assets creation
          and follow-up to make things happen (Epic Owner role). It is in Mynor's DNA to get knowledge,
          process and tools ever improved to get faster, better and cleaner resolution of incidents.
          Far more than a valuable technical and resolution expert, he is also able to step back to
          look at the broader picture. I would really appreciate to get more chances to work with
          Mynor.

      - name: "LinkedIn Colleague"
        role: "Colleague, Amadeus"
        content: >-
          I started at Amadeus under Adam's supervision and have worked under his leadership,
          alongside him as a colleague, and on multiple separate teams collaborating with him. I can
          say with all honesty that his character and drive are unique and unforgettable. Adam
          consistently has demonstrated pinpoint attention to detail, and an unwavering focus on
          ensuring matters are resolved. Whether project-based or problem-based, I've always trusted
          Adam to either have or seek the expertise needed to overdeliver.

      - name: "Nicholas Sellar"
        role: "Colleague, ~10 years"
        content: >-
          For nearly 10 years I had the pleasure of working alongside Mynor. I found Mynor always
          helpful and extremely knowledgeable in his area of expertise. Mynor is adaptable, detailed,
          conscientious worker who would go above and beyond in any task/project he was faced with.

      - name: "Javier Rodriguez"
        role: "Colleague, 15+ years"
        content: >-
          I have been Adam's colleague for over fifteen years. Throughout our years as co-workers I've
          known him to be a trustworthy, dependable, and level-headed guy. He's been able to adapt
          with the times as the IT industry has evolved. Adam is not afraid to speak his mind, but
          always keeps the discussion respectable. He is a driven overachiever and would be a benefit
          to any team.

      - name: "LinkedIn Colleague"
        role: "Colleague, Amadeus"
        content: >-
          I met Mynor the first day I joined Amadeus (he was actually at my interview!). Even though I
          have never worked in the same team with him, we have had the opportunity to interact
          regularly in troubleshooting sessions or projects. He is one of the most valuable colleagues
          I've ever had. He's not only a skilled technology expert, but a great leader! I have complete
          admiration for his patience to teach (it just comes natural to him), and the discipline he
          shows in every challenge he commits to overcome. Every time I've needed help with a problem,
          he's always available, and with the best attitude to help! He is a problem solver, and a
          great coordinator, with excellent communication skills. A few years ago, I had the
          opportunity to work with him in the coordination and delivery of cloud technology trainings
          for our colleagues. I was very impressed by his leadership, knowledge, and determination to
          plan everything. I know the many days and nights he spent preparing for this, and the
          results showed nothing but greatness. His trainings were a success, and this is just one
          example of the quality of work he's accustomed to do. I am very thankful for colleagues like
          Mynor, and cannot recommend him enough!

      - name: "Johan Cabrera"
        role: "Amadeus Global Operations"
        content: >-
          Adam Diaz is a knowledgeable engineer and an excellent team supervisor. In our more than
          three years working together for the Amadeus Global Operations team he has proven himself to
          be a capable leader and an example to follow by our engineers and managers. I've been
          impressed with his organizational skills, his ability to lead the team through any
          extraordinary situations as well as day-to-day operations and have the technical knowledge to
          assist in any area. He excels in his understanding of the administrative requirements of the
          department, while also doing more hands-on management and organization of the team's
          activities and keeping up to date with the latest technological advancements in our business.
          Adam is constantly seeking to improve our technical procedures and business process. Our team
          is more technically proficient and efficient thanks to his hard work. Any team will be
          extremely lucky to have him as a member and its leader.

      - name: "Vladimir Vassiliouk"
        role: "Engineer, Amadeus"
        content: >-
          During my 4 year tenure at Amadeus, it was a pleasure working with Mynor as the lead in our
          team. Mynor was very technical and a great lead. Thanks to his mentorship and technical
          advice I was able to deliver a lot of great projects for Amadeus and improve my skills as an
          Engineer. Mynor played a big role in where my engineering career is today.

      - name: "Christian Rojas, ITIL v.4"
        role: "IT Operations Service Manager, Amadeus"
        content: >-
          While working as an IT Operations Service Manager for Amadeus' front line operational area, I
          had the opportunity to work with Adam as my right hand and immediate eyes & ears to any
